[package]
name = "theme-probe"
version = "0.0.0"
edition = "2021"
publish = false

# 一次性诊断工具，不参与应用构建。空 workspace 表避免被上级 crate 误吸收。
[workspace]

[lints.clippy]
# 与应用 crate 保持一致：项目风格统一使用显式 return
needless_return = "allow"

[dependencies]
windows = { version = "0.61", features = [
    "Foundation",
    "UI_ViewManagement",
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_System_LibraryLoader",
    "Win32_System_Registry",
    "Win32_System_WinRT",
    "Win32_UI_HiDpi",
    "Win32_UI_WindowsAndMessaging",
] }
