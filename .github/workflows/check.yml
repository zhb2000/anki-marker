name: Check (Lint, Type, Format, Clippy, Tests)

# 触发条件：推送或 PR 到 master/build 分支时运行检查
on:
    push:
        branches: ["master", "build"]
    pull_request:
        branches: ["master", "build"]

permissions:
    contents: read

jobs:
    check:
        name: Check on ${{ matrix.os }}
        runs-on: ${{ matrix.os }}
        strategy:
            fail-fast: true
            matrix:
                include:
                    - os: ubuntu-latest
                    - os: windows-latest

        steps:
            - name: Checkout repository
              uses: actions/checkout@v4

            - name: Set up Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: 20
                  cache: npm
                  cache-dependency-path: package-lock.json

            - name: Set up Rust
              uses: dtolnay/rust-toolchain@stable

            - name: Cache cargo registry
              uses: actions/cache@v4
              with:
                  path: |
                      ~/.cargo/registry
                      ~/.cargo/git
                  key: cargo-registry-${{ matrix.os }}-${{ hashFiles('src-tauri/Cargo.lock') }}
                  restore-keys: |
                      cargo-registry-${{ matrix.os }}-
              # 缓存 Rust 依赖注册表和 git 索引

            - name: Cache cargo build
              uses: actions/cache@v4
              with:
                  path: src-tauri/target
                  key: cargo-build-${{ matrix.os }}-${{ hashFiles('src-tauri/Cargo.lock') }}
                  restore-keys: |
                      cargo-build-${{ matrix.os }}-
              # 缓存 Rust 编译产物

            - name: Install Linux dependencies
              if: startsWith(matrix.os, 'ubuntu')
              run: |
                  sudo apt-get update
                  sudo apt-get install -y \
                    libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev \
                    librsvg2-dev patchelf build-essential curl wget libssl-dev

            - name: Install frontend dependencies
              run: npm ci

            - name: Lint frontend code
              run: npm run lint

            - name: Type check and build frontend
              run: npm run build

            - name: Check Rust code format
              run: cargo fmt --all --check

            - name: Run Clippy linter
              run: cargo clippy --all-targets -- -D warnings

            - name: Run Rust tests
              run: cargo test --all
