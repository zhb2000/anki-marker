<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16">
  <!--
    小尺寸单色托盘图标源稿（Windows / Linux 用；macOS 菜单栏用 tray-icon.svg）。

    设计（v2，2026-09 重绘）：
    - 圆角五角星（stroke 圆角化），与应用图标圆角星风格一致；
    - 记号笔为单一连续路径：尾端平顶微圆角，楔形笔尖朝左下（45° 笔轴），
      笔身宽 2.6；
    - 星笔间隙 0.5 分出层次；笔身深压星右下区域，笔尖抵到星底部内凹处，
      星右下臂被间隙通道削短 —— "笔贴着星划过"的紧凑构图，与应用图标里
      笔压星的关系一致。

    16px 像素网格约定：
    - viewBox 16 单位，@16px 时 1 单位 = 1px，坐标即像素栅格；
    - 笔不描边，间隙宽度由 mask 外扩 0.5 单位精确控制。
    颜色用 currentColor 占位，由 build-tray-icons.mjs 换成白/黑后导出。
  -->
  <defs>
    <!-- 挖出笔周围的透明留白：笔形状外扩 0.5 单位 -->
    <mask id="gap">
      <rect width="16" height="16" fill="#fff"/>
      <path transform="translate(10.6 10.3) rotate(45)" fill="#000" stroke="#000" stroke-width="1.0" stroke-linejoin="round"
        d="M-0.95 -3.4 Q-1.3 -3.4 -1.3 -3.05 L-1.3 1.4 L-0.28 3.3 Q0 3.75 0.28 3.3 L1.3 1.4 L1.3 -3.05 Q1.3 -3.4 0.95 -3.4 Z"/>
    </mask>
  </defs>
  <!-- 整体放大 1.16 并向右下偏移（补偿星在左上的视觉重心）：原构图包围盒 (0.85,1.4)~(14.3,13.2)，偏小偏左上 -->
  <g fill="currentColor" transform="translate(-0.31 -0.05) scale(1.16)">
    <!-- 五角星：中心 (6.2,7.0) 外径 5.2 内径 2.4，stroke 圆角化使星角圆润 -->
    <path mask="url(#gap)" stroke="currentColor" stroke-width="0.8" stroke-linejoin="round"
      d="M6.2 1.8 L7.611 5.058 L11.145 5.393 L8.482 7.742 L9.258 11.207 L6.2 9.4 L3.142 11.207 L3.918 7.742 L1.255 5.393 L4.789 5.058 Z"/>
    <!-- 记号笔：一体化路径，楔形笔尖朝左下，尾端平顶微圆角 -->
    <path transform="translate(10.6 10.3) rotate(45)"
      d="M-0.95 -3.4 Q-1.3 -3.4 -1.3 -3.05 L-1.3 1.4 L-0.28 3.3 Q0 3.75 0.28 3.3 L1.3 1.4 L1.3 -3.05 Q1.3 -3.4 0.95 -3.4 Z"/>
  </g>
</svg>
