# 请勿手动修改此字段
__minimal-version__ = "0.0.1"

# 主题模式：system = 跟随系统（默认）、light = 浅色、dark = 深色
theme = "system"

# AnkiConnect 服务的 URL，留空使用默认 http://localhost:8765
anki-connect-url = ""

# 将划词结果添加到哪个牌组，留空使用默认“划词助手默认牌组”
deck-name = ""

# 使用的笔记模板名称，留空使用默认“划词助手默认单词模板”
model-name = ""

# 添加卡片时若 Anki 未运行，是否自动启动 Anki
auto-launch-anki = true

# Anki 可执行文件路径（留空则自动探测）
anki-executable-path = ""

# 划词录入句子的全局快捷键，留空表示未设置（也可以在设置页面中录制）
# 格式如 "Cmd+Shift+KeyS"（修饰键 Cmd/Ctrl/Alt/Shift + 键名；Cmd 在 Windows/Linux 上为 Win/Super 键）
# Linux 仅 X11 会话可用（Wayland 不支持全局快捷键）
global-shortcut = ""

# 选词取句：开启后，划词时只需选中一个单词，即可自动录入该单词所在的整个句子
# 关闭后需选中完整句子再按快捷键录入
word-to-sentence = true

# 关闭窗口时应用是否在后台继续运行（三端）
# 保持运行时窗口仅被隐藏：macOS 可由 Dock 图标、菜单栏图标唤起，三端均可由
# 托盘图标或划词快捷键唤起；也可通过托盘/菜单栏图标的“打开”菜单项打开
keep-running-on-close = true

# 后台运行（关闭窗口保持运行）期间，应用图标显示的位置
# 可选值：menu-bar = 菜单栏/托盘图标（默认）、dock = Dock 栏（仅 macOS）、none = 不显示图标
# 窗口打开时托盘图标不显示（macOS 的 Dock 图标除外），仅在后台运行期间按此选项显示
background-icon = "menu-bar"

# 托盘图标样式（仅 Windows/Linux 生效；macOS 的菜单栏图标由系统按明暗自动着色，忽略此键）
# 可选值：auto = 单色跟随系统（默认）、color = 彩色图标、white = 白色单色、black = 黑色单色
# auto 在 Windows 上读系统“Windows 模式”的深浅（即任务栏的深浅，可与应用模式不同）自动选白/黑；
# Linux 无可靠的托盘底色检测手段，auto 等同 color，深色面板请显式选 white。
# 若任务栏/面板被设为浅色主题色等特殊情况，auto 可能判错，可用 white/black 固定。
tray-icon-style = "auto"

