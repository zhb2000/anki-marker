[package]
name = "anki-marker"
version = "0.2.1-0"
description = "Anki Marker is a tool for creating Anki cards."
authors = ["ZHB"]
license = "GPL-3.0"
repository = "https://github.com/zhb2000/anki-marker"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[build-dependencies]
tauri-build = { version = "2.2", features = [] }

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rusqlite = { version = "0.36", features = ["bundled"] }
toml_edit = "0.22"
notify = "8.0"
notify-debouncer-full = "0.5"
tauri = { version = "2.5", features = [] }
tauri-plugin-http = { version = "2.4", features = ["unsafe-headers"] }
tauri-plugin-dialog = "2.2"
tauri-plugin-os = "2.2"
tauri-plugin-clipboard-manager = "2.2"
sanitise-file-name = "1.0"
# WebDriver automation server, for debugging/testing only. Enabled via the `webdriver` feature.
tauri-plugin-webdriver = { version = "0.2", optional = true }

[features]
# this feature is used for production builds or when `devPath` points to the filesystem
# DO NOT REMOVE!!
custom-protocol = ["tauri/custom-protocol"]
# Start a W3C WebDriver server at http://127.0.0.1:4445 for automated debugging/testing.
# NEVER enable this for release builds (`npm run tauri dev -- --features webdriver`).
webdriver = ["dep:tauri-plugin-webdriver"]

[lints.clippy]
needless_return = "allow"

[profile.release]
panic = 'abort'
lto = true
strip = true
